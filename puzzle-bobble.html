<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PUZZLE BOBBLE">
<title>PUZZLE BOBBLE</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#ffcc00;--gd:#aa7700;--bg:#110800;--glow:rgba(255,200,0,0.12);--amber:#ff5555}
html,body{
  height:100%;height:100dvh;overflow:hidden;background:#000;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
body{
  display:flex;flex-direction:column;align-items:center;
  font-family:'Press Start 2P',monospace;
  background:radial-gradient(ellipse at center,#1a0e00 0%,#0a0400 80%);color:var(--g);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.crt::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(0,0,0,0.05) 4px,rgba(0,0,0,0.05) 6px);
  pointer-events:none;z-index:1000;
}
.crt::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.4) 100%);
  pointer-events:none;z-index:1001;
}
@keyframes titleGlow{
  0%,100%{text-shadow:0 0 2px #fff,0 0 8px var(--g),0 0 20px var(--glow)}
  50%{text-shadow:0 0 4px #fff,0 0 14px var(--g),0 0 30px var(--glow)}
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.game-container{
  display:flex;flex-direction:column;align-items:center;
  width:100%;flex:1;position:relative;
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;flex-shrink:0;z-index:10;
}
.topbar-left{display:flex;flex-direction:column;gap:2px}
.title{font-size:11px;letter-spacing:2px;animation:titleGlow 3s ease-in-out infinite}
.score-text{font-size:7px;text-shadow:0 0 4px var(--g);line-height:1.8}
.score-text span{color:var(--amber);text-shadow:0 0 4px var(--amber)}
.topbar-right{display:flex;align-items:center;gap:8px}
.stat-box{text-align:center}
.stat-lbl{font-size:5px;letter-spacing:1px;opacity:0.6;text-shadow:0 0 3px var(--g)}
.stat-val{font-size:9px;color:var(--amber);text-shadow:0 0 5px var(--amber)}
.board-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  width:100%;position:relative;padding:0;
}
canvas#board{
  border:2px solid var(--gd);
  box-shadow:0 0 15px var(--glow),inset 0 0 25px rgba(0,0,0,0.4);
  image-rendering:pixelated;border-radius:2px;
}
.touch-hint{
  font-size:5px;letter-spacing:1px;opacity:0.3;text-align:center;
  padding:4px 0 8px 0;flex-shrink:0;text-shadow:0 0 3px var(--g);
}
.pause-btn{
  font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gd);
  background:none;border:1px solid var(--gd);padding:8px 12px;border-radius:3px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.pause-btn:active{color:var(--g);border-color:var(--g)}
.topbar-btns{display:flex;align-items:center;gap:4px}
.music-btn{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gd);background:none;border:1px solid var(--gd);padding:5px 7px;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.music-btn:active{color:var(--g);border-color:var(--g)}
.music-btn.off{opacity:0.3}
.overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,0.88);z-index:500;gap:16px;text-align:center;
}
.overlay h1{font-size:18px;letter-spacing:3px;animation:titleGlow 2s ease-in-out infinite;color:#ffffff}
.overlay h2{font-size:13px;color:var(--amber);text-shadow:0 0 8px var(--amber)}
.overlay .sub{font-size:7px;line-height:2.4;opacity:0.7}
.overlay .start-hint{font-size:8px;animation:blink 1.2s step-end infinite;margin-top:12px}
.overlay .final-score{font-size:9px;line-height:2.4}
.overlay .final-score span{color:var(--amber);text-shadow:0 0 6px var(--amber)}
.hidden{display:none !important}
.pause-overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.85);z-index:400;gap:24px;
}
.pause-overlay .pause-text{font-size:14px;letter-spacing:4px;animation:blink 1.5s step-end infinite}
.pause-menu-btn{
  font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gd);
  background:none;border:1px solid var(--gd);padding:10px 16px;border-radius:3px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:2px;
}
.pause-menu-btn:active{color:var(--g);border-color:var(--g)}
.pause-menu-btn.sel{color:var(--amber);border-color:var(--amber);text-shadow:0 0 6px var(--amber)}
.confirm-box{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;border:1px solid var(--gd);background:rgba(7,7,7,0.95)}
.confirm-q{font-size:8px;letter-spacing:2px;line-height:2}
.confirm-btns{display:flex;gap:16px}
.confirm-yes,.confirm-no{font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 18px;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:2px;background:none}
.confirm-yes{color:var(--amber);border:1px solid var(--amber)}
.confirm-no{color:var(--gd);border:1px solid var(--gd)}
.confirm-yes.sel,.confirm-yes:active{background:rgba(255,170,0,0.15);color:#fff;border-color:#fff}
.confirm-no.sel,.confirm-no:active{background:rgba(255,200,0,0.1);color:var(--g);border-color:var(--g)}
</style>
</head>
<body class="crt">

<!-- Start screen -->
<div class="overlay" id="startScreen">
  <h1>PUZZLE BOBBLE</h1>
  <div class="sub">SWIPE ←→ TO AIM<br>TAP TO SHOOT<br>MATCH 3+ BUBBLES!</div>
  <div class="start-hint">TAP TO START</div>
</div>

<!-- Game over -->
<div class="overlay hidden" id="gameOver">
  <h2>GAME OVER</h2>
  <div class="final-score">SCORE <span id="finalScore">0</span><br>LEVEL <span id="finalLevel">1</span></div>
  <button class="pause-menu-btn sel" id="goRetryBtn">RETRY</button>
  <button class="pause-menu-btn" id="goMenuBtn">EXIT TO MENU</button>
</div>

<!-- Win screen -->
<div class="overlay hidden" id="winScreen">
  <h2 style="color:#ffcc00">YOU WIN!</h2>
  <div class="final-score">SCORE <span id="winScore">0</span><br>LEVEL <span id="winLevel">7</span></div>
  <button class="pause-menu-btn sel" id="winContinueBtn">CONTINUE</button>
  <button class="pause-menu-btn" id="winRetryBtn">RETRY</button>
  <button class="pause-menu-btn" id="winMenuBtn">EXIT TO MENU</button>
</div>

<!-- Game -->
<div class="game-container" id="gameUI">
  <div class="topbar">
    <div class="topbar-left">
      <div class="title">PUZZLE BOBBLE</div>
      <div class="score-text">SCORE <span id="score">0</span> &nbsp;HI <span id="hi">0</span></div>
    </div>
    <div class="topbar-btns"><button class="music-btn" id="musicBtn">&#9834;</button><button class="pause-btn" id="pauseBtn">PAUSE</button></div>
    <div class="topbar-right">
      <div class="stat-box"><div class="stat-lbl">LEVEL</div><div class="stat-val" id="level">1</div></div>
    </div>
  </div>
  <div class="board-wrap" id="boardWrap">
    <canvas id="board" width="288" height="400"></canvas>
    <div class="touch-hint">SWIPE ←→ AIM &nbsp; TAP SHOOT</div>
  </div>
</div>

<!-- Pause overlay -->
<div class="pause-overlay hidden" id="pauseOverlay">
  <div class="pause-text">PAUSE</div>
  <button class="pause-menu-btn" id="resumeBtn">RESUME</button>
  <button class="pause-menu-btn" id="menuBtn">EXIT TO MENU</button>
  <div class="confirm-box hidden" id="confirmBox">
    <div class="confirm-q">EXIT TO MENU?</div>
    <div class="confirm-btns">
      <button class="confirm-yes sel" id="confirmYes">YES</button>
      <button class="confirm-no" id="confirmNo">NO</button>
    </div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const CANVAS_W = 288, CANVAS_H = 400;
const R = 18;
const ROW_H = R * Math.sqrt(3);
const COLS_EVEN = 8;
const COLS_ODD = 7;
const MAX_ROWS = 14;
const GRID_Y = 5;
const DANGER_ROW = 10;
const SHOOTER_X = 144;
const SHOOTER_Y = 371;
const BUBBLE_SPEED = 600;
const SHOTS_PER_DROP = 8;
const AIM_STEP = 0.04;
const MIN_ANGLE = -(Math.PI - 0.22);
const MAX_ANGLE = -0.22;
const COLORS = ['#ff5555','#55aaff','#55ff55','#ffff55','#ff88ff','#ffaa00'];

// ── Canvas ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

// ── Background (cached offscreen) ───────────────────────────────────────────
const bgCanvas = document.createElement('canvas');
bgCanvas.width = CANVAS_W; bgCanvas.height = CANVAS_H;
const bgCtx = bgCanvas.getContext('2d');
(function buildBg() {
  // Base: deep warm amber gradient
  const g = bgCtx.createLinearGradient(0, 0, 0, CANVAS_H);
  g.addColorStop(0, '#060300');
  g.addColorStop(0.45, '#130800');
  g.addColorStop(1, '#221000');
  bgCtx.fillStyle = g; bgCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Moon glow behind the bubble grid
  const moon = bgCtx.createRadialGradient(CANVAS_W/2, CANVAS_H*0.37, 0, CANVAS_W/2, CANVAS_H*0.37, 130);
  moon.addColorStop(0, 'rgba(255,180,40,0.1)');
  moon.addColorStop(0.55, 'rgba(255,110,0,0.05)');
  moon.addColorStop(1, 'rgba(0,0,0,0)');
  bgCtx.fillStyle = moon; bgCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Seeded stars — warm gold / pale white tones
  const rng = s => { const x = Math.sin(s + 1) * 10000; return x - Math.floor(x); };
  for (let i = 0; i < 75; i++) {
    const x = rng(i * 2.7) * CANVAS_W;
    const y = rng(i * 5.3) * CANVAS_H;
    const sz = rng(i * 1.9) < 0.14 ? 1.3 : 0.65;
    const a = 0.22 + rng(i * 8.1) * 0.58;
    const warm = rng(i * 3.3);
    bgCtx.beginPath(); bgCtx.arc(x, y, sz, 0, Math.PI * 2);
    bgCtx.fillStyle = warm > 0.62
      ? `rgba(255,210,70,${a})`
      : warm > 0.32
        ? `rgba(255,240,170,${a})`
        : `rgba(255,255,255,${a * 0.7})`;
    bgCtx.fill();
  }

  // Faint top arch ornament (frames the bubble ceiling)
  bgCtx.strokeStyle = 'rgba(180,110,0,0.18)'; bgCtx.lineWidth = 1;
  bgCtx.beginPath(); bgCtx.arc(CANVAS_W / 2, -18, CANVAS_W * 0.52, 0.08, Math.PI - 0.08);
  bgCtx.stroke();

  // Warm ground glow behind the shooter
  const base = bgCtx.createRadialGradient(CANVAS_W / 2, CANVAS_H, 0, CANVAS_W / 2, CANVAS_H, 100);
  base.addColorStop(0, 'rgba(255,130,0,0.16)');
  base.addColorStop(1, 'rgba(0,0,0,0)');
  bgCtx.fillStyle = base; bgCtx.fillRect(0, CANVAS_H - 100, CANVAS_W, 100);
})();

// ── Audio ───────────────────────────────────────────────────────────────────
let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(freq,duration,opts){try{const ac=ensureAudio();let vol=0.08,wave='sawtooth',attack=0.005,pitchEnd=0,detune=0;if(typeof opts==='number'){vol=opts;}else if(opts){vol=opts.vol??0.08;wave=opts.wave??'sawtooth';attack=opts.attack??0.005;pitchEnd=opts.pitchEnd??0;detune=opts.detune??0;}const now=ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.type=wave;o.frequency.value=freq;if(pitchEnd)o.frequency.linearRampToValueAtTime(pitchEnd,now+duration);g.gain.value=0.001;g.gain.linearRampToValueAtTime(vol,now+attack);g.gain.exponentialRampToValueAtTime(0.001,now+duration);o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+duration);if(detune&&!lowPerf){const o2=ac.createOscillator(),g2=ac.createGain();o2.type=wave;o2.frequency.value=freq;o2.detune.value=detune;if(pitchEnd)o2.frequency.linearRampToValueAtTime(pitchEnd,now+duration);g2.gain.value=0.001;g2.gain.linearRampToValueAtTime(vol*0.6,now+attack);g2.gain.exponentialRampToValueAtTime(0.001,now+duration);o2.connect(g2);g2.connect(ac.destination);o2.start(now);o2.stop(now+duration);}}catch(e){}}
function beepNoise(duration,volume,filterFreq){try{const ac=ensureAudio();if(!_noiseBuf){_noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=_noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const now=ac.currentTime;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=_noiseBuf;f.type='lowpass';f.frequency.value=filterFreq||1000;g.gain.value=volume||0.08;g.gain.exponentialRampToValueAtTime(0.001,now+duration);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(now);s.stop(now+duration);}catch(e){}}
let _noiseBuf;

function midiHz(n){return 440*Math.pow(2,(n-69)/12);}
// Puzzle Bobble — cute, bouncy, playful, 135 BPM, F major
const SONG={bpm:135,stepsPerBeat:4,
  voices:[
    // Melody — playful bouncy tune
    {wave:'square',gain:0.035,attack:0.008,release:0.1,notes:[
      65,0,69,0, 72,0,69,0, 65,0,67,0, 69,0,0,0,
      67,0,65,0, 64,0,65,0, 67,0,69,0, 72,0,0,0,
      77,0,76,0, 74,0,72,0, 69,0,67,0, 65,0,0,0,
      67,0,69,0, 72,0,74,0, 76,0,77,0, 0,0,0,0
    ]},
    // Bass — bouncy roots
    {wave:'triangle',gain:0.04,attack:0.01,release:0.08,notes:[
      41,0,41,0, 41,0,41,0, 45,0,45,0, 45,0,45,0,
      43,0,43,0, 43,0,43,0, 48,0,48,0, 48,0,48,0,
      41,0,41,0, 41,0,41,0, 45,0,45,0, 45,0,45,0,
      43,0,43,0, 48,0,48,0, 41,0,0,0, 0,0,0,0
    ]},
    // Counter melody — cute chirps
    {wave:'square',gain:0.02,attack:0.005,release:0.05,notes:[
      77,0,0,77, 0,0,77,0, 76,0,0,76, 0,0,76,0,
      74,0,0,74, 0,0,74,0, 72,0,0,72, 0,0,72,0,
      77,0,0,77, 0,0,77,0, 76,0,0,76, 0,0,76,0,
      74,0,0,74, 0,72,0,74, 77,0,0,0, 0,0,0,0
    ]}
  ],
  drums:{gain:0.022,pattern:[
    'k',0,'h','h', 's',0,'h',0, 'k','k','h','h', 's',0,'h',0,
    'k',0,'h','h', 's',0,'h',0, 'k','k','h','h', 's',0,'h','h',
    'k',0,'h','h', 's',0,'h',0, 'k','k','h','h', 's',0,'h',0,
    'k',0,'h','h', 's',0,'h','h', 'k','k','s',0, 'k',0,'h',0
  ]}
};
const music={playing:false,_step:0,_timer:null,_nextTime:0,_stepDur:0,_masterGain:null,_noiseBuffer:null,
  play(){if(this.playing)this.stop();if(localStorage.getItem('arcade_music')!=='1')return;if(!SONG.voices.length&&!SONG.drums)return;try{const ac=ensureAudio();this._masterGain=ac.createGain();this._masterGain.gain.value=1.0;this._masterGain.connect(ac.destination);this._stepDur=60/(SONG.bpm*SONG.stepsPerBeat);this._step=0;this._nextTime=ac.currentTime+0.05;this.playing=true;this._schedule();this._timer=setInterval(()=>this._schedule(),25);}catch(e){}},
  stop(){this.playing=false;if(this._timer){clearInterval(this._timer);this._timer=null;}if(this._masterGain){try{this._masterGain.disconnect();}catch(e){}this._masterGain=null;}},
  pause(){this.playing=false;if(this._timer){clearInterval(this._timer);this._timer=null;}},
  resume(){if(localStorage.getItem('arcade_music')!=='1')return;if(!SONG.voices.length&&!SONG.drums)return;try{const ac=ensureAudio();if(!this._masterGain){this._masterGain=ac.createGain();this._masterGain.gain.value=1.0;this._masterGain.connect(ac.destination);}this._nextTime=ac.currentTime+0.05;this.playing=true;this._timer=setInterval(()=>this._schedule(),25);}catch(e){}},
  _schedule(){if(!this.playing)return;try{const ac=ensureAudio();while(this._nextTime<ac.currentTime+0.1){const t=this._nextTime,dur=this._stepDur;const maxV=lowPerf?Math.min(2,SONG.voices.length):SONG.voices.length;for(let v=0;v<maxV;v++){const voice=SONG.voices[v];const note=voice.notes[this._step%voice.notes.length];if(note>0){const o=ac.createOscillator(),g=ac.createGain();o.type=voice.wave||'square';o.frequency.value=midiHz(note);const att=voice.attack||0.01,rel=voice.release||dur*0.8;g.gain.value=0.001;g.gain.linearRampToValueAtTime(voice.gain||0.04,t+att);g.gain.exponentialRampToValueAtTime(0.001,t+rel);o.connect(g);g.connect(this._masterGain);o.start(t);o.stop(t+rel+0.01);}}if(SONG.drums&&!lowPerf){const dp=SONG.drums.pattern;const hit=dp[this._step%dp.length];if(hit)this._playDrum(hit,t,SONG.drums.gain||0.03);}this._step++;this._nextTime+=dur;}}catch(e){}},
  _playDrum(type,time,vol){try{const ac=ensureAudio();if(type==='k'){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=150;o.frequency.exponentialRampToValueAtTime(30,time+0.1);g.gain.value=vol*1.5;g.gain.exponentialRampToValueAtTime(0.001,time+0.12);o.connect(g);g.connect(this._masterGain);o.start(time);o.stop(time+0.13);}else if(type==='h'){if(!this._noiseBuffer){this._noiseBuffer=ac.createBuffer(1,ac.sampleRate*0.05,ac.sampleRate);const d=this._noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=this._noiseBuffer;f.type='highpass';f.frequency.value=7000;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(0.001,time+0.05);s.connect(f);f.connect(g);g.connect(this._masterGain);s.start(time);s.stop(time+0.06);}else if(type==='s'){if(!this._noiseBuffer){this._noiseBuffer=ac.createBuffer(1,ac.sampleRate*0.05,ac.sampleRate);const d=this._noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=this._noiseBuffer;f.type='bandpass';f.frequency.value=3000;g.gain.value=vol*1.2;g.gain.exponentialRampToValueAtTime(0.001,time+0.1);s.connect(f);f.connect(g);g.connect(this._masterGain);s.start(time);s.stop(time+0.11);const o=ac.createOscillator(),g2=ac.createGain();o.type='sine';o.frequency.value=180;g2.gain.value=vol;g2.gain.exponentialRampToValueAtTime(0.001,time+0.08);o.connect(g2);g2.connect(this._masterGain);o.start(time);o.stop(time+0.09);}}catch(e){}}
};
const musicBtn=document.getElementById('musicBtn');
function updateMusicBtn(){musicBtn.classList.toggle('off',localStorage.getItem('arcade_music')!=='1');}
function toggleMusic(){const off=localStorage.getItem('arcade_music')==='1';localStorage.setItem('arcade_music',off?'0':'1');updateMusicBtn();if(off)music.stop();else if(gameRunning&&!paused)music.play();}
musicBtn.addEventListener('click',e=>{e.stopPropagation();toggleMusic();});
musicBtn.addEventListener('touchend',e=>{e.stopPropagation();e.preventDefault();toggleMusic();});
updateMusicBtn();

function checkPerf() {
  if (++_fpsFrames < 60) return;
  lowPerf = (60000 / (performance.now() - _fpsTime)) < 40;
  _fpsFrames = 0; _fpsTime = performance.now();
}

// ── State ───────────────────────────────────────────────────────────────────
let grid, flyBubble, shooterAngle, currentColor, nextColor;
let scoreVal, hiScore, levelVal, shotsLeft, gameRunning, paused, lastTime;
let lowPerf = false, _fpsFrames = 0, _fpsTime = performance.now();
let particles, fallingBubbles;
let levelFlash; // {text, timer}
let levelIntro; // {elapsed, duration, rows} — pop-in animation for new level bubbles
let numColors;  // colors in use for current level
let gridParity; // 0|1 — flips each drop so bubbles keep their visual x-positions
let dropAnim;   // {t: 0..1, duration} — animates new row sliding down
let gameOverAnim; // {elapsed, duration} — red flash on game over

// ── Grid helpers ─────────────────────────────────────────────────────────────
function bubbleX(col, row) {
  return ((row + gridParity) % 2 === 0) ? R + col * 2 * R : 2 * R + col * 2 * R;
}
function bubbleY(row) {
  return GRID_Y + row * ROW_H;
}
function colsInRow(row) { return (row + gridParity) % 2 === 0 ? COLS_EVEN : COLS_ODD; }

function hexNeighbors(row, col) {
  const n = [];
  // same row
  if (col > 0) n.push([row, col-1]);
  if (col < colsInRow(row)-1) n.push([row, col+1]);
  // rows above/below — offset depends on parity-adjusted even/odd
  const isEven = (row + gridParity) % 2 === 0;
  const offsets = isEven
    ? [[-1,0],[-1,-1],[1,0],[1,-1]]  // even row
    : [[-1,0],[-1,1],[1,0],[1,1]];   // odd row
  for (const [dr, dc] of offsets) {
    const nr = row + dr, nc = col + dc;
    if (nr >= 0 && nr < MAX_ROWS && nc >= 0 && nc < colsInRow(nr)) n.push([nr, nc]);
  }
  return n;
}
// ── BFS helpers ───────────────────────────────────────────────────────────
function findGroup(startRow, startCol) {
  const color = grid[startRow][startCol];
  if (!color) return [];
  const visited = new Set();
  const queue = [[startRow, startCol]];
  const key = (r, c) => r * 100 + c;
  visited.add(key(startRow, startCol));
  while (queue.length) {
    const [r, c] = queue.shift();
    for (const [nr, nc] of hexNeighbors(r, c)) {
      const k = key(nr, nc);
      if (!visited.has(k) && grid[nr][nc] === color) {
        visited.add(k);
        queue.push([nr, nc]);
      }
    }
  }
  return [...visited].map(k => [Math.floor(k/100), k%100]);
}

function findFloating() {
  // BFS from top row - find all bubbles connected to ceiling
  const connected = new Set();
  const key = (r, c) => r * 100 + c;
  const queue = [];
  for (let c = 0; c < colsInRow(0); c++) {
    if (grid[0][c]) { connected.add(key(0,c)); queue.push([0,c]); }
  }
  while (queue.length) {
    const [r, c] = queue.shift();
    for (const [nr, nc] of hexNeighbors(r, c)) {
      const k = key(nr, nc);
      if (!connected.has(k) && grid[nr] && grid[nr][nc]) {
        connected.add(k); queue.push([nr, nc]);
      }
    }
  }
  // All bubbles NOT in connected set are floating
  const floating = [];
  for (let r = 0; r < MAX_ROWS; r++) {
    for (let c = 0; c < colsInRow(r); c++) {
      if (grid[r][c] && !connected.has(key(r,c))) {
        floating.push([r, c]);
      }
    }
  }
  return floating;
}

function snapBubble(x, y, color) {
  invalidateAimPath();
  // Find nearest empty grid cell (skip center of row 0)
  let bestRow = 0, bestCol = 0, bestDist = Infinity;
  const centerCol0 = Math.floor(colsInRow(0) / 2);
  // only search within valid range
  const rowMin = Math.max(0, Math.floor((y - GRID_Y - R*3) / ROW_H));
  const rowMax = Math.min(MAX_ROWS-1, Math.ceil((y - GRID_Y + R*3) / ROW_H));
  for (let row = rowMin; row <= rowMax; row++) {
    for (let col = 0; col < colsInRow(row); col++) {
      if (grid[row][col]) continue;
      if (row === 0 && col === centerCol0) continue; // never snap to center of row 0
      const d = Math.hypot(x - bubbleX(col, row), y - bubbleY(row));
      if (d < bestDist) { bestDist = d; bestRow = row; bestCol = col; }
    }
  }
  // also check neighbors of existing bubbles near hit point
  for (let row = Math.max(0,rowMin-1); row <= Math.min(MAX_ROWS-1,rowMax+1); row++) {
    for (let col = 0; col < colsInRow(row); col++) {
      if (!grid[row][col]) continue;
      for (const [nr, nc] of hexNeighbors(row, col)) {
        if (grid[nr] && !grid[nr][nc]) {
          if (nr === 0 && nc === centerCol0) continue; // never snap to center of row 0
          const d = Math.hypot(x - bubbleX(nc, nr), y - bubbleY(nr));
          if (d < bestDist) { bestDist = d; bestRow = nr; bestCol = nc; }
        }
      }
    }
  }
  grid[bestRow][bestCol] = color;

  // Match check
  const group = findGroup(bestRow, bestCol);
  if (group.length >= 3) {
    // Pop group
    for (const [r, c] of group) {
      spawnParticles(bubbleX(c, r), bubbleY(r), grid[r][c], 6);
      grid[r][c] = null;
    }
    scoreVal += group.length * 10 * levelVal;
    beep(660, 0.15, {vol:0.12,detune:7});

    // Find floating
    const floating = findFloating();
    for (const [r, c] of floating) {
      spawnFalling(bubbleX(c, r), bubbleY(r), grid[r][c]);
      grid[r][c] = null;
    }
    if (floating.length > 0) {
      scoreVal += floating.length * 20 * levelVal;
      beep(440, 0.1, 0.09);
    }
  }

  // Check level clear before potentially adding a new row
  if (isGridEmpty()) {
    levelUp();
    return;
  }

  // Decrement shots, maybe drop grid
  shotsLeft--;
  if (shotsLeft <= 0) {
    dropGrid();
    shotsLeft = SHOTS_PER_DROP;
  }
  // Check game over
  if (checkGameOver()) return;

  // Load next bubble
  currentColor = nextColor;
  nextColor = randomGridColor();
  updateUI();
}

function gridColors() {
  const s = new Set();
  for (let r = 0; r < MAX_ROWS; r++)
    for (let c = 0; c < colsInRow(r); c++)
      if (grid[r][c]) s.add(grid[r][c]);
  return s.size ? Array.from(s) : COLORS.slice(0, numColors);
}

function randomGridColor() {
  const c = gridColors();
  return c[Math.floor(Math.random() * c.length)];
}

function isGridEmpty() {
  for (let r = 0; r < MAX_ROWS; r++)
    for (let c = 0; c < colsInRow(r); c++)
      if (grid[r][c]) return false;
  return true;
}

function checkGameOver() {
  for (let c = 0; c < colsInRow(DANGER_ROW); c++) {
    if (grid[DANGER_ROW][c]) { triggerGameOver(DANGER_ROW, c); return true; }
  }
  return false;
}
// ── Grid management ──────────────────────────────────────────────────────
function dropGrid() {
  invalidateAimPath();
  // Shift rows down (before parity flip — row sizes are consistent pre-flip)
  for (let r = MAX_ROWS - 1; r > 0; r--) {
    for (let c = 0; c < COLS_EVEN; c++) grid[r][c] = grid[r-1][c];
  }
  // Flip parity: after this, colsInRow(r) == old colsInRow(r-1),
  // so every bubble's visual x-position is unchanged.
  gridParity = 1 - gridParity;
  // Generate new row 0 — only place balls adjacent to existing row-1 bubbles
  for (let c = 0; c < COLS_EVEN; c++) grid[0][c] = null;
  const colors = gridColors();
  const cols0 = colsInRow(0);
  // Find which row-0 columns are hex-neighbors of occupied row-1 cells
  const eligible = new Set();
  for (let c = 0; c < colsInRow(1); c++) {
    if (!grid[1][c]) continue;
    // row-1 neighbors in row-0 (use hexNeighbors logic for row 1 → row 0)
    const isEven1 = (1 + gridParity) % 2 === 0;
    const offUp = isEven1 ? [0, -1] : [0, 1]; // col offsets for the row above
    for (const dc of offUp) {
      const nc = c + dc;
      if (nc >= 0 && nc < cols0) eligible.add(nc);
    }
  }
  // Fallback: if row 1 was empty (player cleared top), pick a few random positions
  if (eligible.size === 0) {
    const centerCol = Math.floor(cols0 / 2);
    for (let c = 0; c < cols0; c++) {
      if (c === centerCol) continue;
      if (Math.random() < 0.5) eligible.add(c);
    }
    // Guarantee at least 2 balls
    while (eligible.size < 2) {
      const c = Math.floor(Math.random() * cols0);
      if (c !== Math.floor(cols0 / 2)) eligible.add(c);
    }
  }
  for (const c of eligible) {
    grid[0][c] = colors[Math.floor(Math.random() * colors.length)];
  }
  // Start slide-in animation: fast snap from above
  dropAnim = { t: 0, duration: 140 };
  beep(200, 0.12, 0.1);
  if (checkGameOver()) return;
}

function generateGrid(rows) {
  invalidateAimPath();
  gridParity = 0;
  grid = [];
  for (let r = 0; r < MAX_ROWS; r++) {
    grid.push(new Array(COLS_EVEN).fill(null));
  }
  const colors = COLORS.slice(0, numColors);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < colsInRow(r); c++) {
      grid[r][c] = colors[Math.floor(Math.random() * colors.length)];
    }
  }
}

function levelRows(lv) {
  if (lv <= 4) return 4;
  if (lv <= 7) return lv; // 5→5, 6→6, 7→7
  return 7;
}

function levelUp() {
  levelVal++;
  if (levelVal === 8) { triggerWin(); return; }
  const rows = levelRows(levelVal);
  numColors = Math.min(2 + levelVal, 6);
  // Phase 1: show level text on empty grid, delay before bubbles appear
  levelFlash = { text: 'LEVEL ' + levelVal, timer: 3000 };
  levelIntro = { phase: 'text', delay: 1000, elapsed: 0, rows: rows,
                 duration: 600 + rows * 80 };
  beep(880, 0.15, 0.1);
  setTimeout(() => beep(1100, 0.15, 0.1), 160);
  shotsLeft = Math.max(5, SHOTS_PER_DROP - Math.floor(levelVal / 3));
  updateUI();
}

function finishLevelIntro() {
  currentColor = randomGridColor();
  nextColor = randomGridColor();
  levelIntro = null;
  updateUI();
}

function triggerGameOver(startRow, startCol) {
  music.stop();
  gameRunning = false;

  // BFS wave: assign each bubble an arrival time based on distance from offending bubble
  const STEP = 55;  // ms per hop
  const FADE = 90;  // ms to fade to grey once reached
  const greyTimes = Array.from({length: MAX_ROWS}, () => new Array(COLS_EVEN).fill(null));
  const visited = new Set();
  const queue = [[startRow, startCol, 0]];
  visited.add(startRow + ',' + startCol);
  let maxTime = 0;
  while (queue.length) {
    const [r, c, dist] = queue.shift();
    if (!grid[r][c]) continue;
    greyTimes[r][c] = dist * STEP;
    if (greyTimes[r][c] > maxTime) maxTime = greyTimes[r][c];
    for (const [nr, nc] of hexNeighbors(r, c)) {
      const k = nr + ',' + nc;
      if (!visited.has(k) && grid[nr][nc]) { visited.add(k); queue.push([nr, nc, dist + 1]); }
    }
  }
  const totalDuration = maxTime + FADE + 80;
  gameOverAnim = { elapsed: 0, duration: totalDuration, greyTimes, FADE };

  beep(110, 0.6, 0.15);
  setTimeout(() => beep(80, 0.8, 0.15), 300);
  beepNoise(0.15, 0.1, 300);
  document.getElementById('finalScore').textContent = scoreVal;
  document.getElementById('finalLevel').textContent = levelVal;
  if (scoreVal > hiScore) {
    hiScore = scoreVal;
    try { localStorage.setItem('puzzlebobble_hi', hiScore); } catch(e) {}
  }
  setTimeout(() => {
    document.getElementById('gameOver').classList.remove('hidden');
    goSel = 0; updateGoSel();
  }, totalDuration + 50);
  requestAnimationFrame(gameLoop);
}

// ── Particles ──────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 60 + Math.random() * 80;
    particles.push({
      x, y, color,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      r: 3 + Math.random() * 3
    });
  }
}

function spawnFalling(x, y, color) {
  fallingBubbles.push({ x, y, color, vy: 100 });
}

// ── Aim line ───────────────────────────────────────────────────────────────
let _aimPathCache = null;
let _aimPathDirty = true;
function invalidateAimPath() { _aimPathDirty = true; }
function computeAimPath() {
  if (!_aimPathDirty && _aimPathCache) return _aimPathCache;
  const pts = [[SHOOTER_X, SHOOTER_Y - 4]];
  let x = SHOOTER_X, y = SHOOTER_Y - 4;
  let vx = Math.cos(shooterAngle), vy = Math.sin(shooterAngle);
  const step = 3;
  const maxSteps = 700;
  for (let i = 0; i < maxSteps; i++) {
    const nx = x + vx * step, ny = y + vy * step;
    // Wall bounce: compute exact intersection point, record it, continue from there
    if (nx - R < 0) {
      const t = (R - x) / vx;
      x = R; y = y + vy * t;
      pts.push([x, y]);
      vx = -vx;
      continue;
    }
    if (nx + R > CANVAS_W) {
      const t = (CANVAS_W - R - x) / vx;
      x = CANVAS_W - R; y = y + vy * t;
      pts.push([x, y]);
      vx = -vx;
      continue;
    }
    x = nx; y = ny;
    // Hit ceiling
    if (y - R <= GRID_Y) { pts.push([x, GRID_Y + R]); break; }
    // Hit grid bubble
    let hit = false;
    const rowApprox = Math.round((y - GRID_Y) / ROW_H);
    for (let dr = -1; dr <= 1 && !hit; dr++) {
      const row = rowApprox + dr;
      if (row < 0 || row >= MAX_ROWS) continue;
      for (let c = 0; c < colsInRow(row) && !hit; c++) {
        if (!grid[row][c]) continue;
        if (Math.hypot(x - bubbleX(c, row), y - bubbleY(row)) < R * 2) {
          pts.push([x, y]); hit = true;
        }
      }
    }
    if (hit) break;
  }
  _aimPathCache = pts;
  _aimPathDirty = false;
  return pts;
}
// ── Draw ──────────────────────────────────────────────────────────────────
function drawBubble(x, y, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha !== undefined ? alpha : 1;
  // Fill
  ctx.beginPath();
  ctx.arc(x, y, R - 1, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  // Highlight — simple white circle, no gradient (perf: avoids createRadialGradient per bubble)
  ctx.globalAlpha = (alpha !== undefined ? alpha : 1) * 0.45;
  ctx.beginPath();
  ctx.arc(x - R * 0.3, y - R * 0.3, R * 0.28, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  // Border
  ctx.globalAlpha = alpha !== undefined ? alpha : 1;
  ctx.beginPath();
  ctx.arc(x, y, R - 1, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function drawGrid() {
  // During drop animation, offset bubbles upward at start and ease into final position.
  // The data shift already moved rows down by one; the visual offset compensates by
  // starting at -ROW_H (so old rows appear where they were) and easing to 0.
  const t = dropAnim ? Math.min(dropAnim.t, 1) : 1;
  const ease = 1 - (1 - t) * (1 - t) * (1 - t); // ease-out cubic — snappier
  const yOff = dropAnim ? -(1 - ease) * ROW_H : 0;

  // Level intro pop-in: each row staggers in with a scale+bounce effect
  const introScale = levelIntro && levelIntro.phase === 'pop';
  const introElapsed = introScale ? levelIntro.elapsed : 0;
  const rowDelay = 80; // ms stagger between rows

  for (let r = 0; r < MAX_ROWS; r++) {
    for (let c = 0; c < colsInRow(r); c++) {
      if (!grid[r][c]) continue;
      if (introScale) {
        const t0 = r * rowDelay;
        const prog = Math.max(0, Math.min(1, (introElapsed - t0) / 350));
        if (prog <= 0) continue; // not started yet
        // ease-out back for bouncy pop-in
        const s = 1 + 2.5;
        const p = prog - 1;
        const scale = 1 + p * p * ((s + 1) * p + s); // overshoot then settle
        const x = bubbleX(c, r);
        const y = bubbleY(r);
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        drawBubble(0, 0, grid[r][c]);
        ctx.restore();
      } else {
        const x = bubbleX(c, r), y = bubbleY(r) + yOff;
        drawBubble(x, y, grid[r][c]);
        // Game-over grey wave overlay
        if (gameOverAnim && gameOverAnim.greyTimes[r][c] !== null) {
          const prog = Math.max(0, Math.min(1, (gameOverAnim.elapsed - gameOverAnim.greyTimes[r][c]) / gameOverAnim.FADE));
          if (prog > 0) {
            ctx.save();
            ctx.globalAlpha = prog * 0.88;
            ctx.beginPath();
            ctx.arc(x, y, R - 1, 0, Math.PI * 2);
            ctx.fillStyle = '#1e1e1e';
            ctx.fill();
            ctx.restore();
          }
        }
      }
    }
  }
}

function drawDangerLine() {
  const dy = bubbleY(DANGER_ROW) - ROW_H * 0.5;
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(255,85,85,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, dy); ctx.lineTo(CANVAS_W, dy);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawAimLine() {
  if (!gameRunning || levelIntro) return;
  if (flyBubble) return; // don't show when bubble flying
  const pts = computeAimPath();
  if (pts.length < 2) return;
  ctx.save();
  ctx.setLineDash([4, 7]);
  ctx.lineDashOffset = -(Date.now() / 30) % 11;
  ctx.strokeStyle = 'rgba(255,200,0,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawShooter() {
  const sx = SHOOTER_X, sy = SHOOTER_Y;
  const bx = sx, by = sy - 4;
  const arcR = 36;

  // ── Semicircular arc track ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(bx, by, arcR, MIN_ANGLE, MAX_ANGLE);
  ctx.strokeStyle = '#aa7700';
  ctx.lineWidth = 4;
  if (!lowPerf) { ctx.shadowColor = '#aa7700'; ctx.shadowBlur = 5; }
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(bx, by, arcR - 2.5, MIN_ANGLE, MAX_ANGLE);
  ctx.strokeStyle = 'rgba(255,200,0,0.22)';
  ctx.lineWidth = 1.5;
  if (!lowPerf) ctx.shadowBlur = 0;
  ctx.stroke();
  ctx.restore();

  // ── Rotating pointer ──
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(shooterAngle + Math.PI / 2);

  const sw      = 2.5;  // shaft half-width
  const tipLen  = 40;   // pivot → tip (pokes through arc)
  const tipH    = 13;   // spearhead section length
  const tipHW   = 7;    // spearhead max half-width
  const crossY  = 2;    // crossbar Y offset from pivot (slightly toward tail)
  const crossHW = 12;   // crossbar half-length
  const crossW  = 4;    // crossbar thickness
  const tailLen = 22;   // pivot → tail end

  ctx.fillStyle   = '#cce6ff';
  ctx.strokeStyle = '#1a3a80';
  ctx.lineWidth   = 1;

  // Shaft (full length from spearhead base to tail)
  ctx.beginPath();
  ctx.rect(-sw, -(tipLen - tipH), sw * 2, (tipLen - tipH) + tailLen);
  ctx.fill();
  ctx.stroke();

  // Spearhead — curved lance tip using quadratic bezier on each side
  ctx.beginPath();
  ctx.moveTo(0, -tipLen);                                    // sharp apex
  ctx.quadraticCurveTo(-tipHW * 0.55, -(tipLen - tipH * 0.45), -tipHW, -(tipLen - tipH)); // left curve
  ctx.lineTo(-sw, -(tipLen - tipH));
  ctx.moveTo(sw, -(tipLen - tipH));
  ctx.lineTo(tipHW, -(tipLen - tipH));
  ctx.quadraticCurveTo(tipHW * 0.55, -(tipLen - tipH * 0.45), 0, -tipLen);  // right curve
  ctx.strokeStyle = '#1a3a80';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Solid fill for spearhead
  ctx.beginPath();
  ctx.moveTo(0, -tipLen);
  ctx.quadraticCurveTo(-tipHW * 0.55, -(tipLen - tipH * 0.45), -tipHW, -(tipLen - tipH));
  ctx.lineTo(tipHW, -(tipLen - tipH));
  ctx.quadraticCurveTo(tipHW * 0.55, -(tipLen - tipH * 0.45), 0, -tipLen);
  ctx.closePath();
  ctx.fillStyle = '#cce6ff';
  ctx.fill();
  ctx.stroke();

  // Crossbar (T-bar at pivot)
  ctx.fillStyle   = '#cce6ff';
  ctx.strokeStyle = '#1a3a80';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.rect(-crossHW, crossY - crossW / 2, crossHW * 2, crossW);
  ctx.fill();
  ctx.stroke();

  // Feather vanes (arrow fletching at tail)
  // Each vane: a curved leaf shape angling outward and backward from the shaft
  const fY      = tailLen - 4;  // vane root (near tail tip)
  const fHeight = 15;           // vane length along shaft direction
  const fSpread = 10;           // how far vane extends outward

  // Left vane
  ctx.beginPath();
  ctx.moveTo(-sw, fY);
  ctx.quadraticCurveTo(-sw - fSpread, fY - fHeight * 0.6, -sw - fSpread * 0.5, fY - fHeight);
  ctx.quadraticCurveTo(-sw - fSpread * 0.1, fY - fHeight * 0.3, -sw, fY - fHeight);
  ctx.closePath();
  ctx.fillStyle   = '#cce6ff';
  ctx.strokeStyle = '#1a3a80';
  ctx.fill();
  ctx.stroke();

  // Right vane
  ctx.beginPath();
  ctx.moveTo(sw, fY);
  ctx.quadraticCurveTo(sw + fSpread, fY - fHeight * 0.6, sw + fSpread * 0.5, fY - fHeight);
  ctx.quadraticCurveTo(sw + fSpread * 0.1, fY - fHeight * 0.3, sw, fY - fHeight);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();

  // ── Central hub ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(bx, by, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#cce6ff';
  ctx.strokeStyle = '#1a3a80';
  ctx.lineWidth = 1.5;
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // ── Current bubble — hidden while in flight or during level intro ──
  if (!flyBubble && !levelIntro) {
    drawBubble(bx, by, currentColor);
  }

  // ── Next bubble preview — hidden during level intro ──
  if (!levelIntro) {
    const nextX = R + 12;
    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.font = '5px "Press Start 2P"';
    ctx.fillStyle = 'rgba(255,200,0,0.5)';
    ctx.textAlign = 'center';
    ctx.fillText('NEXT', nextX, by - R - 2);
    ctx.restore();
    drawBubble(nextX, by, nextColor, 0.75);
  }
}

function drawFlyingBubble() {
  if (!flyBubble) return;
  drawBubble(flyBubble.x, flyBubble.y, flyBubble.color);
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life * 0.9;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.restore();
  }
}

function drawFallingBubbles() {
  for (const b of fallingBubbles) {
    drawBubble(b.x, b.y, b.color);
  }
}

function drawLevelFlash() {
  if (!levelFlash || levelFlash.timer <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, levelFlash.timer / 500);
  const dangerY = bubbleY(DANGER_ROW) - ROW_H * 0.5;
  ctx.font = '14px "Press Start 2P"';
  ctx.fillStyle = '#ffcc00';
  if (!lowPerf) { ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 20; }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(levelFlash.text, CANVAS_W / 2, dangerY - 6);
  ctx.restore();
}

function draw() {
  ctx.drawImage(bgCanvas, 0, 0);
  drawDangerLine();
  drawAimLine();
  drawGrid();
  drawFlyingBubble();
  drawFallingBubbles();
  drawParticles();
  drawShooter();
  drawLevelFlash();
}
// ── UI ─────────────────────────────────────────────────────────────────────
function updateUI() {
  document.getElementById('score').textContent = scoreVal;
  document.getElementById('hi').textContent = hiScore;
  document.getElementById('level').textContent = levelVal;
  if (scoreVal > hiScore) {
    hiScore = scoreVal;
    try { localStorage.setItem('puzzlebobble_hi', hiScore); } catch(e) {}
    document.getElementById('hi').textContent = hiScore;
  }
}

// ── Game over menu ─────────────────────────────────────────────────────────
let goSel = 0;
function updateGoSel() {
  document.getElementById('goRetryBtn').classList.toggle('sel', goSel === 0);
  document.getElementById('goMenuBtn').classList.toggle('sel', goSel === 1);
}
function goRetry() { document.getElementById('gameOver').classList.add('hidden'); startGame(); }
function goMenu() { window.location.href = 'index.html'; }

// ── Win screen ────────────────────────────────────────────────────────────
let winSel = 0;
function updateWinSel() {
  document.getElementById('winContinueBtn').classList.toggle('sel', winSel === 0);
  document.getElementById('winRetryBtn').classList.toggle('sel', winSel === 1);
  document.getElementById('winMenuBtn').classList.toggle('sel', winSel === 2);
}

function triggerWin() {
  music.stop();
  gameRunning = false;
  beep(880, 0.2, {vol:0.12,detune:8,attack:0.01});
  setTimeout(() => beep(1100, 0.2, {vol:0.12,detune:8,attack:0.01}), 150);
  setTimeout(() => beep(1320, 0.3, {vol:0.12,detune:8,attack:0.01}), 300);
  document.getElementById('winScore').textContent = scoreVal;
  document.getElementById('winLevel').textContent = levelVal;
  if (scoreVal > hiScore) {
    hiScore = scoreVal;
    try { localStorage.setItem('puzzlebobble_hi', hiScore); } catch(e) {}
  }
  setTimeout(() => {
    document.getElementById('winScreen').classList.remove('hidden');
    winSel = 0; updateWinSel();
  }, 600);
}

function winContinue() {
  document.getElementById('winScreen').classList.add('hidden');
  gameRunning = true;
  lastTime = 0;
  // levelVal is already incremented to 8 by levelUp() that triggered the win;
  // set up level 8 directly without incrementing again
  const rows = levelRows(levelVal);
  numColors = Math.min(2 + levelVal, 6);
  levelFlash = { text: 'LEVEL ' + levelVal, timer: 3000 };
  levelIntro = { phase: 'text', delay: 1000, elapsed: 0, rows: rows,
                 duration: 600 + rows * 80 };
  beep(880, 0.15, 0.1);
  setTimeout(() => beep(1100, 0.15, 0.1), 160);
  shotsLeft = Math.max(5, SHOTS_PER_DROP - Math.floor(levelVal / 3));
  updateUI();
  music.play();
  requestAnimationFrame(gameLoop);
}
function winRetry() { document.getElementById('winScreen').classList.add('hidden'); startGame(); }

// ── Input: game actions ────────────────────────────────────────────────────
function moveLeft()  { shooterAngle = Math.max(MIN_ANGLE, shooterAngle - AIM_STEP); invalidateAimPath(); }
function moveRight() { shooterAngle = Math.min(MAX_ANGLE, shooterAngle + AIM_STEP); invalidateAimPath(); }
function tapAction() {
  if (flyBubble || levelIntro) return;
  const speed = BUBBLE_SPEED;
  flyBubble = {
    x: SHOOTER_X, y: SHOOTER_Y - 4,
    vx: Math.cos(shooterAngle) * speed,
    vy: Math.sin(shooterAngle) * speed,
    color: currentColor
  };
  beep(440, 0.08, {vol:0.1,wave:'square',attack:0.01});
}

// ── Update ─────────────────────────────────────────────────────────────────
function update(dt) {
  const sec = dt / 1000;

  // Flying bubble
  if (flyBubble) {
    flyBubble.x += flyBubble.vx * sec;
    flyBubble.y += flyBubble.vy * sec;

    // Wall bounce
    if (flyBubble.x - R < 0) {
      flyBubble.x = R; flyBubble.vx = Math.abs(flyBubble.vx);
      beep(220, 0.05, 0.07);
    }
    if (flyBubble.x + R > CANVAS_W) {
      flyBubble.x = CANVAS_W - R; flyBubble.vx = -Math.abs(flyBubble.vx);
      beep(220, 0.05, 0.07);
    }

    // Hit ceiling
    if (flyBubble.y - R <= GRID_Y) {
      const saved = { ...flyBubble };
      flyBubble = null;
      snapBubble(saved.x, GRID_Y, saved.color);
      return;
    }

    // Hit existing grid bubble
    let snapped = false;
    const rowApprox = Math.round((flyBubble.y - GRID_Y) / ROW_H);
    for (let dr = -2; dr <= 2 && !snapped; dr++) {
      const row = rowApprox + dr;
      if (row < 0 || row >= MAX_ROWS) continue;
      for (let c = 0; c < colsInRow(row) && !snapped; c++) {
        if (!grid[row][c]) continue;
        const dist = Math.hypot(flyBubble.x - bubbleX(c, row), flyBubble.y - bubbleY(row));
        if (dist < R * 2 - 1) {
          const saved = { ...flyBubble };
          flyBubble = null;
          snapBubble(saved.x, saved.y, saved.color);
          snapped = true;
        }
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * sec;
    p.y += p.vy * sec;
    p.vy += 120 * sec; // gravity
    p.life -= sec * 2.0;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Falling bubbles
  for (let i = fallingBubbles.length - 1; i >= 0; i--) {
    const b = fallingBubbles[i];
    b.vy += 350 * sec;
    b.y += b.vy * sec;
    if (b.y > CANVAS_H + R) fallingBubbles.splice(i, 1);
  }

  // Drop animation
  if (dropAnim) {
    dropAnim.t += dt / dropAnim.duration;
    if (dropAnim.t >= 1) dropAnim = null;
  }

  // Level flash timer
  if (levelFlash && levelFlash.timer > 0) levelFlash.timer -= dt;

  // Level intro animation
  if (levelIntro) {
    levelIntro.elapsed += dt;
    if (levelIntro.phase === 'text') {
      // Waiting phase — show level text before spawning bubbles
      if (levelIntro.elapsed >= levelIntro.delay) {
        // Generate grid and switch to pop-in phase
        generateGrid(levelIntro.rows);
        levelIntro.phase = 'pop';
        levelIntro.elapsed = 0;
        beep(330, 0.1, 0.08);
      }
    } else if (levelIntro.phase === 'pop') {
      if (levelIntro.elapsed >= levelIntro.duration) {
        finishLevelIntro();
      }
    }
  }
}
// ── Keyboard ──────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  // Confirm dialog
  if (!document.getElementById('confirmBox').classList.contains('hidden')) {
    if (e.key==='ArrowLeft'||e.key==='y'||e.key==='Y'){e.preventDefault();confirmSel=0;updateConfirmSel();}
    else if(e.key==='ArrowRight'||e.key==='n'||e.key==='N'){e.preventDefault();confirmSel=1;updateConfirmSel();}
    else if(e.key==='Enter'){e.preventDefault();if(confirmSel===0)window.location.href='index.html';else hideConfirm();}
    else if(e.key==='Escape'){e.preventDefault();hideConfirm();}
    return;
  }
  // Pause menu
  if (paused) {
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();pauseSel=pauseSel===0?1:0;updatePauseSel();return;}
    if(e.key==='Enter'){e.preventDefault();if(pauseSel===1)showConfirm();else togglePause();return;}
    if(e.key==='Escape'||e.key==='p'||e.key==='P'){e.preventDefault();togglePause();return;}
    return;
  }
  if(e.key==='m'||e.key==='M'){e.preventDefault();toggleMusic();return;}
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault();togglePause();return;}
  // Win screen menu
  if(!document.getElementById('winScreen').classList.contains('hidden')){
    if(e.key==='ArrowDown'){e.preventDefault();winSel=Math.min(2,winSel+1);updateWinSel();}
    else if(e.key==='ArrowUp'){e.preventDefault();winSel=Math.max(0,winSel-1);updateWinSel();}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(winSel===0)winContinue();else if(winSel===1)winRetry();else goMenu();}
    return;
  }
  // Game over menu
  if(!document.getElementById('gameOver').classList.contains('hidden')){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();goSel=goSel===0?1:0;updateGoSel();}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(goSel===1)goMenu();else goRetry();}
    return;
  }
  if(!gameRunning||paused)return;
  switch(e.key){
    case 'ArrowLeft':  e.preventDefault(); moveLeft(); break;
    case 'ArrowRight': e.preventDefault(); moveRight(); break;
    case 'ArrowUp':
    case ' ':          e.preventDefault(); tapAction(); break;
  }
});

// ── Touch ──────────────────────────────────────────────────────────────────
let tx, ty, tt, moved, lastMX, startY;
const SH = 4;

document.addEventListener('touchstart', e => {
  if (!gameRunning || paused || e.target.closest('.topbar')) return;
  e.preventDefault();
  const t = e.touches[0];
  tx = t.clientX; ty = t.clientY; startY = t.clientY; tt = Date.now();
  moved = false; lastMX = tx;
}, { passive: false });

document.addEventListener('touchmove', e => {
  if (!gameRunning || paused) return;
  e.preventDefault();
  const t = e.touches[0];
  const dx = t.clientX - lastMX;
  if (Math.abs(dx) > SH) {
    const s = Math.floor(Math.abs(dx) / SH);
    for (let i = 0; i < s; i++) { if (dx > 0) moveRight(); else moveLeft(); }
    lastMX += Math.sign(dx) * s * SH;
    moved = true;
  }
}, { passive: false });

document.addEventListener('touchend', e => {
  if (!gameRunning || paused) return;
  e.preventDefault();
  const el = Date.now() - tt;
  const ct = e.changedTouches[0];
  const fdx = ct.clientX - tx;
  const fdy = ct.clientY - startY;
  if (!moved && el < 250 && Math.abs(fdx) < 12 && Math.abs(fdy) < 12) tapAction();
}, { passive: false });

// ── Mouse ──
canvas.addEventListener('mousemove', e => {
  if (!gameRunning || paused) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  const angle = Math.atan2(my - SHOOTER_Y, mx - SHOOTER_X);
  shooterAngle = Math.max(MIN_ANGLE, Math.min(MAX_ANGLE, angle));
  invalidateAimPath();
});
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0 || !gameRunning || paused) return;
  tapAction();
});

// ── Pause ──────────────────────────────────────────────────────────────────
const pauseOv = document.getElementById('pauseOverlay');
let pauseSel = 0;
function updatePauseSel() {
  document.getElementById('resumeBtn').classList.toggle('sel', pauseSel===0);
  document.getElementById('menuBtn').classList.toggle('sel', pauseSel===1);
}
function togglePause() {
  if (!gameRunning) return;
  paused = !paused;
  pauseOv.classList.toggle('hidden', !paused);
  if (!paused) { lastTime = 0; music.resume(); requestAnimationFrame(gameLoop); }
  else { music.pause(); pauseSel = 0; updatePauseSel(); }
}
document.getElementById('pauseBtn').addEventListener('click',  e => { e.stopPropagation(); togglePause(); });
document.getElementById('pauseBtn').addEventListener('touchend', e => { e.stopPropagation(); e.preventDefault(); togglePause(); });
pauseOv.addEventListener('click', e => {
  if (!['resumeBtn','menuBtn','confirmYes','confirmNo'].includes(e.target.id) && !e.target.closest('#confirmBox')) togglePause();
});
pauseOv.addEventListener('touchend', e => {
  if (!['resumeBtn','menuBtn','confirmYes','confirmNo'].includes(e.target.id) && !e.target.closest('#confirmBox')) { e.preventDefault(); togglePause(); }
});
['click','touchend'].forEach(ev => document.getElementById('resumeBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); togglePause(); }));

let confirmSel = 0;
function showConfirm() { document.getElementById('confirmBox').classList.remove('hidden'); confirmSel=0; updateConfirmSel(); }
function hideConfirm() { document.getElementById('confirmBox').classList.add('hidden'); }
function updateConfirmSel() {
  document.getElementById('confirmYes').classList.toggle('sel', confirmSel===0);
  document.getElementById('confirmNo').classList.toggle('sel', confirmSel===1);
}
['click','touchend'].forEach(ev => document.getElementById('menuBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); showConfirm(); }));
['click','touchend'].forEach(ev => document.getElementById('confirmYes').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); window.location.href='index.html'; }));
['click','touchend'].forEach(ev => document.getElementById('confirmNo').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); hideConfirm(); }));
// ── Game loop ─────────────────────────────────────────────────────────────
function gameLoop(time) {
  if (!gameRunning) {
    if (gameOverAnim) {
      const dt = Math.min(time - (lastTime || time), 60);
      lastTime = time;
      gameOverAnim.elapsed += dt;
      draw();
      if (gameOverAnim.elapsed < gameOverAnim.duration) requestAnimationFrame(gameLoop);
      // don't null gameOverAnim — keeps bubbles grey until overlay appears
    } else {
      draw();
    }
    return;
  }
  if (paused) return;
  const dt = Math.min(time - (lastTime || time), 60);
  lastTime = time;
  checkPerf();
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// ── Start ─────────────────────────────────────────────────────────────────
function startGame() {
  document.getElementById('winScreen').classList.add('hidden');
  document.getElementById('gameOver').classList.add('hidden');
  scoreVal = 0;
  levelVal = 1;
  gameRunning = true;
  paused = false;
  lastTime = 0;
  flyBubble = null;
  particles = [];
  fallingBubbles = [];
  levelFlash = null;
  levelIntro = null;
  dropAnim = null;
  gameOverAnim = null;
  shooterAngle = -Math.PI / 2; invalidateAimPath();
  shotsLeft = SHOTS_PER_DROP;
  numColors = 3;
  try { hiScore = parseInt(localStorage.getItem('puzzlebobble_hi')) || 0; } catch(e) { hiScore = 0; }
  // Start with empty grid — levelIntro will generate and animate it
  generateGrid(0);
  // Use the same intro animation as levelUp
  const rows = 4;
  levelFlash = { text: 'LEVEL 1', timer: 3000 };
  levelIntro = { phase: 'text', delay: 1000, elapsed: 0, rows: rows,
                 duration: 600 + rows * 80 };
  updateUI();
  draw();
  music.play();
  requestAnimationFrame(gameLoop);
}

['click','touchend'].forEach(ev => {
  document.getElementById('startScreen').addEventListener(ev, e => {
    e.preventDefault(); document.getElementById('startScreen').classList.add('hidden'); startGame();
  });
  document.getElementById('goRetryBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); goRetry(); });
  document.getElementById('goMenuBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); goMenu(); });
  document.getElementById('winContinueBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); winContinue(); });
  document.getElementById('winRetryBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); winRetry(); });
  document.getElementById('winMenuBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); goMenu(); });
});

document.addEventListener('keydown', e => {
  if (e.key==='Enter'||e.key===' ') {
    const s = document.getElementById('startScreen');
    if (!s.classList.contains('hidden')) { e.preventDefault(); s.classList.add('hidden'); startGame(); }
  }
});

// ── Resize ────────────────────────────────────────────────────────────────
function resize() {
  const tb = document.querySelector('.topbar'), th = document.querySelector('.touch-hint');
  const aH = window.innerHeight - (tb ? tb.offsetHeight : 0) - (th ? th.offsetHeight : 0);
  const aW = window.innerWidth;
  const aspect = CANVAS_H / CANVAS_W;
  let h = aH, w = h / aspect;
  if (w > aW) { w = aW; h = w * aspect; }
  canvas.style.width = Math.floor(w) + 'px';
  canvas.style.height = Math.floor(h) + 'px';
  document.getElementById('gameUI').style.width = Math.floor(w) + 'px';
}
window.addEventListener('resize', resize);
setTimeout(resize, 50); setTimeout(resize, 200); resize();

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// Draw initial background
ctx.drawImage(bgCanvas, 0, 0);
</script>
