<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GAMENAME">
<title>GAMENAME</title>
<link rel="icon" href="data:,">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#55aaff;--gd:#2255aa;--bg:#000033;--glow:rgba(85,170,255,0.12);--amber:#ff5555}
html,body{
  height:100%;height:100dvh;overflow:hidden;background:#000;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
body{
  display:flex;flex-direction:column;align-items:center;
  font-family:'Press Start 2P',monospace;
  background:radial-gradient(ellipse at center,#000828 0%,#000010 80%);color:var(--g);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.crt::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(0,0,0,0.05) 4px,rgba(0,0,0,0.05) 6px);
  pointer-events:none;z-index:1000;
}
.crt::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.4) 100%);
  pointer-events:none;z-index:1001;
}
@keyframes titleGlow{
  0%,100%{text-shadow:0 0 2px #fff,0 0 8px var(--g),0 0 20px var(--glow)}
  50%{text-shadow:0 0 4px #fff,0 0 14px var(--g),0 0 30px var(--glow)}
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.game-container{
  display:flex;flex-direction:column;align-items:center;
  width:100%;flex:1;position:relative;
}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;flex-shrink:0;z-index:10;
}
.topbar-left{display:flex;flex-direction:column;gap:2px}
.title{font-size:14px;letter-spacing:4px;animation:titleGlow 3s ease-in-out infinite}
.score-text{font-size:7px;text-shadow:0 0 4px var(--g);line-height:1.8}
.score-text span{color:var(--amber);text-shadow:0 0 4px var(--amber)}
.topbar-right{display:flex;align-items:center;gap:8px}
.stat-box{text-align:center}
.stat-lbl{font-size:5px;letter-spacing:1px;opacity:0.6;text-shadow:0 0 3px var(--g)}
.stat-val{font-size:9px;color:var(--amber);text-shadow:0 0 5px var(--amber)}

.board-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  width:100%;position:relative;padding:0;
}
canvas#board{
  border:2px solid var(--gd);
  box-shadow:0 0 15px var(--glow),inset 0 0 25px rgba(0,0,0,0.4);
  image-rendering:pixelated;border-radius:2px;
}
.touch-hint{
  font-size:5px;letter-spacing:1px;opacity:0.3;text-align:center;
  padding:4px 0 8px 0;flex-shrink:0;text-shadow:0 0 3px var(--g);
}
.pause-btn{
  font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gd);
  background:none;border:1px solid var(--gd);padding:8px 12px;border-radius:3px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.pause-btn:active{color:var(--g);border-color:var(--g)}
.topbar-btns{display:flex;align-items:center;gap:6px}
.music-btn{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gd);background:none;border:1px solid var(--gd);padding:8px 10px;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.music-btn:active{color:var(--g);border-color:var(--g)}
.music-btn.off{opacity:0.3}

.overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,0.88);z-index:500;gap:16px;text-align:center;
}
.overlay h1{font-size:22px;letter-spacing:5px;animation:titleGlow 2s ease-in-out infinite;color:#ffffff}
.overlay h2{font-size:13px;color:var(--amber);text-shadow:0 0 8px var(--amber)}
.overlay .sub{font-size:7px;line-height:2.4;opacity:0.7}
.overlay .start-hint{font-size:8px;animation:blink 1.2s step-end infinite;margin-top:12px}
.overlay .final-score{font-size:9px;line-height:2.4}
.overlay .final-score span{color:var(--amber);text-shadow:0 0 6px var(--amber)}
.hidden{display:none !important}
.pause-overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.85);z-index:400;gap:24px;
}
.pause-overlay .pause-text{font-size:14px;letter-spacing:4px;animation:blink 1.5s step-end infinite}
.pause-menu-btn{
  font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gd);
  background:none;border:1px solid var(--gd);padding:10px 16px;border-radius:3px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:2px;
}
.pause-menu-btn:active{color:var(--g);border-color:var(--g)}
.pause-menu-btn.sel{color:var(--amber);border-color:var(--amber);text-shadow:0 0 6px var(--amber)}
.confirm-box{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;border:1px solid var(--gd);background:rgba(7,7,7,0.95)}
.confirm-q{font-size:8px;letter-spacing:2px;line-height:2}
.confirm-btns{display:flex;gap:16px}
.confirm-yes,.confirm-no{font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 18px;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:2px;background:none}
.confirm-yes{color:var(--amber);border:1px solid var(--amber)}
.confirm-no{color:var(--gd);border:1px solid var(--gd)}
.confirm-yes.sel,.confirm-yes:active{background:rgba(255,170,0,0.15);color:#fff;border-color:#fff}
.confirm-no.sel,.confirm-no:active{background:rgba(85,170,255,0.1);color:var(--g);border-color:var(--g)}
</style>
</head>
<body class="crt">

<!-- Aloitusruutu -->
<div class="overlay" id="startScreen">
  <h1>GAMENAME</h1>
  <div class="sub">← → SWIPE MOVE<br>TAP = ACTION<br>DESCRIBE THE GOAL!</div>
  <div class="start-hint">TAP TO START</div>
</div>

<!-- Game over -->
<div class="overlay hidden" id="gameOver">
  <h2>GAME OVER</h2>
  <div class="final-score">SCORE <span id="finalScore">0</span></div>
  <button class="pause-menu-btn sel" id="goRetryBtn">RETRY</button>
  <button class="pause-menu-btn" id="goMenuBtn">EXIT TO MENU</button>
</div>

<!-- Peli -->
<div class="game-container" id="gameUI">
  <div class="topbar">
    <div class="topbar-left">
      <div class="title">GAMENAME</div>
      <div class="score-text">SCORE <span id="score">0</span> &nbsp;HI <span id="hi">0</span></div>
    </div>
    <div class="topbar-btns">
      <button class="music-btn" id="musicBtn">&#9834;</button>
      <button class="pause-btn" id="pauseBtn">PAUSE</button>
    </div>
    <div class="topbar-right">
      <!-- Lisää pelikohtaiset statit tähän, esim: -->
      <!-- <div class="stat-box"><div class="stat-lbl">LIVES</div><div class="stat-val" id="lives">3</div></div> -->
    </div>
  </div>
  <div class="board-wrap" id="boardWrap">
    <canvas id="board" width="300" height="450"></canvas>
    <div class="touch-hint">SWIPE ←→ MOVE &nbsp; TAP ACTION</div>
  </div>
</div>

<!-- Pause overlay -->
<div class="pause-overlay hidden" id="pauseOverlay">
  <div class="pause-text">PAUSE</div>
  <button class="pause-menu-btn" id="resumeBtn">RESUME</button>
  <button class="pause-menu-btn" id="menuBtn">EXIT TO MENU</button>
  <div class="confirm-box hidden" id="confirmBox">
    <div class="confirm-q">EXIT TO MENU?</div>
    <div class="confirm-btns">
      <button class="confirm-yes sel" id="confirmYes">YES</button>
      <button class="confirm-no" id="confirmNo">NO</button>
    </div>
  </div>
</div>

<script>
// ── Vakiot ──────────────────────────────────────────────────────────────────
const CANVAS_W = 300, CANVAS_H = 450; // muuta pelin mukaan
// TODO: lisää pelikohtaiset vakiot

// ── Tila ────────────────────────────────────────────────────────────────────
let scoreVal, hiScore, gameRunning, paused, lastTime;
let lowPerf = false, _fpsFrames = 0, _fpsTime = performance.now();
// TODO: lisää pelikohtaiset tilamuuttujat

// ── Canvas ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

// ── Audio ────────────────────────────────────────────────────────────────────
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Enhanced beep: beep(freq, dur) or beep(freq, dur, vol) or beep(freq, dur, {vol, wave, attack, pitchEnd, detune})
function beep(freq, duration, opts) {
  try {
    const ac = ensureAudio();
    let vol = 0.08, wave = 'sawtooth', attack = 0.005, pitchEnd = 0, detune = 0;
    if (typeof opts === 'number') { vol = opts; }
    else if (opts) { vol = opts.vol ?? 0.08; wave = opts.wave ?? 'sawtooth'; attack = opts.attack ?? 0.005; pitchEnd = opts.pitchEnd ?? 0; detune = opts.detune ?? 0; }
    const now = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = wave; o.frequency.value = freq;
    if (pitchEnd) o.frequency.linearRampToValueAtTime(pitchEnd, now + duration);
    g.gain.value = 0.001; g.gain.linearRampToValueAtTime(vol, now + attack);
    g.gain.exponentialRampToValueAtTime(0.001, now + duration);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + duration);
    if (detune && !lowPerf) {
      const o2 = ac.createOscillator(), g2 = ac.createGain();
      o2.type = wave; o2.frequency.value = freq; o2.detune.value = detune;
      if (pitchEnd) o2.frequency.linearRampToValueAtTime(pitchEnd, now + duration);
      g2.gain.value = 0.001; g2.gain.linearRampToValueAtTime(vol * 0.6, now + attack);
      g2.gain.exponentialRampToValueAtTime(0.001, now + duration);
      o2.connect(g2); g2.connect(ac.destination);
      o2.start(now); o2.stop(now + duration);
    }
  } catch(e) {}
}

// Noise beep for percussive/explosion effects
let _noiseBuf;
function beepNoise(duration, volume = 0.08, filterFreq = 1000) {
  try {
    const ac = ensureAudio();
    if (!_noiseBuf) { _noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = _noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const now = ac.currentTime;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = _noiseBuf; f.type = 'lowpass'; f.frequency.value = filterFreq;
    g.gain.value = volume; g.gain.exponentialRampToValueAtTime(0.001, now + duration);
    s.connect(f); f.connect(g); g.connect(ac.destination);
    s.start(now); s.stop(now + duration);
  } catch(e) {}
}

// ── Music Engine (pattern sequencer) ─────────────────────────────────────────
// MIDI note to Hz
function midiHz(n) { return 440 * Math.pow(2, (n - 69) / 12); }

// Song definition — replace with game-specific melody
// Notes: MIDI numbers (60=C4, 0=rest), negative = tie (hold previous)
const SONG = {
  bpm: 120, stepsPerBeat: 4,
  voices: [
    // TODO: define game-specific voices
    // { wave: 'square', gain: 0.04, notes: [60,0,64,0, 67,0,72,0, ...], attack: 0.01, release: 0.08 },
    // { wave: 'triangle', gain: 0.03, notes: [36,0,36,0, ...], attack: 0.01, release: 0.06 },
  ],
  drums: null
  // drums: { gain: 0.03, pattern: ['k',0,'h',0, 'k','h','k','h', ...] }
  // k=kick, h=hihat, s=snare
};

const music = {
  playing: false, _step: 0, _timer: null, _nextTime: 0, _stepDur: 0,
  _masterGain: null, _noiseBuffer: null,

  play() {
    if (this.playing) this.stop();
    if (localStorage.getItem('arcade_music') === '0') return;
    if (!SONG.voices.length && !SONG.drums) return;
    try {
      const ac = ensureAudio();
      this._masterGain = ac.createGain();
      this._masterGain.gain.value = 1.0;
      this._masterGain.connect(ac.destination);
      this._stepDur = 60 / (SONG.bpm * SONG.stepsPerBeat);
      this._step = 0;
      this._nextTime = ac.currentTime + 0.05;
      this.playing = true;
      this._schedule();
      this._timer = setInterval(() => this._schedule(), 25);
    } catch(e) {}
  },

  stop() {
    this.playing = false;
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
    if (this._masterGain) { try { this._masterGain.disconnect(); } catch(e) {} this._masterGain = null; }
  },

  pause() { this.playing = false; if (this._timer) { clearInterval(this._timer); this._timer = null; } },

  resume() {
    if (localStorage.getItem('arcade_music') === '0') return;
    if (!SONG.voices.length && !SONG.drums) return;
    try {
      const ac = ensureAudio();
      if (!this._masterGain) { this._masterGain = ac.createGain(); this._masterGain.gain.value = 1.0; this._masterGain.connect(ac.destination); }
      this._nextTime = ac.currentTime + 0.05;
      this.playing = true;
      this._timer = setInterval(() => this._schedule(), 25);
    } catch(e) {}
  },

  _schedule() {
    if (!this.playing) return;
    try {
      const ac = ensureAudio();
      const lookAhead = 0.1;
      while (this._nextTime < ac.currentTime + lookAhead) {
        const t = this._nextTime;
        const dur = this._stepDur;
        const maxVoices = lowPerf ? Math.min(2, SONG.voices.length) : SONG.voices.length;
        // Melodic voices
        for (let v = 0; v < maxVoices; v++) {
          const voice = SONG.voices[v];
          const note = voice.notes[this._step % voice.notes.length];
          if (note > 0) {
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = voice.wave || 'square';
            o.frequency.value = midiHz(note);
            const att = voice.attack || 0.01;
            const rel = voice.release || dur * 0.8;
            g.gain.value = 0.001;
            g.gain.linearRampToValueAtTime(voice.gain || 0.04, t + att);
            g.gain.exponentialRampToValueAtTime(0.001, t + rel);
            o.connect(g); g.connect(this._masterGain);
            o.start(t); o.stop(t + rel + 0.01);
          }
        }
        // Drums
        if (SONG.drums && !lowPerf) {
          const dp = SONG.drums.pattern;
          const hit = dp[this._step % dp.length];
          if (hit) this._playDrum(hit, t, SONG.drums.gain || 0.03);
        }
        this._step++;
        this._nextTime += dur;
      }
    } catch(e) {}
  },

  _playDrum(type, time, vol) {
    try {
      const ac = ensureAudio();
      if (type === 'k') { // kick
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = 150;
        o.frequency.exponentialRampToValueAtTime(30, time + 0.1);
        g.gain.value = vol * 1.5; g.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
        o.connect(g); g.connect(this._masterGain); o.start(time); o.stop(time + 0.13);
      } else if (type === 'h') { // hihat
        if (!this._noiseBuffer) {
          this._noiseBuffer = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate);
          const d = this._noiseBuffer.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = this._noiseBuffer; f.type = 'highpass'; f.frequency.value = 7000;
        g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        s.connect(f); f.connect(g); g.connect(this._masterGain); s.start(time); s.stop(time + 0.06);
      } else if (type === 's') { // snare
        if (!this._noiseBuffer) {
          this._noiseBuffer = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate);
          const d = this._noiseBuffer.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = this._noiseBuffer; f.type = 'bandpass'; f.frequency.value = 3000;
        g.gain.value = vol * 1.2; g.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
        s.connect(f); f.connect(g); g.connect(this._masterGain); s.start(time); s.stop(time + 0.11);
        const o = ac.createOscillator(), g2 = ac.createGain();
        o.type = 'sine'; o.frequency.value = 180;
        g2.gain.value = vol; g2.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
        o.connect(g2); g2.connect(this._masterGain); o.start(time); o.stop(time + 0.09);
      }
    } catch(e) {}
  }
};

// ── Music Toggle ─────────────────────────────────────────────────────────────
const musicBtn = document.getElementById('musicBtn');
function updateMusicBtn() { musicBtn.classList.toggle('off', localStorage.getItem('arcade_music') === '0'); }
function toggleMusic() {
  const off = localStorage.getItem('arcade_music') !== '0';
  localStorage.setItem('arcade_music', off ? '0' : '1');
  updateMusicBtn();
  if (off) music.stop(); else if (gameRunning && !paused) music.play();
}
musicBtn.addEventListener('click', e => { e.stopPropagation(); toggleMusic(); });
musicBtn.addEventListener('touchend', e => { e.stopPropagation(); e.preventDefault(); toggleMusic(); });
updateMusicBtn();

// ── Suorituskyky ─────────────────────────────────────────────────────────────
// Measures FPS every 60 frames and sets lowPerf=true when below 40fps.
// Use: wrap ctx.shadowBlur assignments with `if (!lowPerf)` to skip glow
// effects on slow devices (e.g. iPhone in Low Power Mode throttles to 30fps).
function checkPerf() {
  if (++_fpsFrames < 60) return;
  lowPerf = (60000 / (performance.now() - _fpsTime)) < 40;
  _fpsFrames = 0; _fpsTime = performance.now();
}

// ── Pelilogiikka ─────────────────────────────────────────────────────────────
// TODO: lisää pelilogiikka tähän

// ── Tausta ───────────────────────────────────────────────────────────────────
function drawBackground() {
  // TODO: draw game-specific background scene (sky, stars, etc.)
  ctx.fillStyle = '#000033';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ── Piirto ───────────────────────────────────────────────────────────────────
function draw() {
  drawBackground();
  // TODO: piirra peli
}

// ── UI ───────────────────────────────────────────────────────────────────────
function updateUI() {
  document.getElementById('score').textContent = scoreVal;
  if (scoreVal > hiScore) {
    hiScore = scoreVal;
    try { localStorage.setItem('gamename_hi', hiScore); } catch(e) {}
  }
  document.getElementById('hi').textContent = hiScore;
}

function showGameOver() {
  music.stop();
  document.getElementById('finalScore').textContent = scoreVal;
  document.getElementById('gameOver').classList.remove('hidden');
  goSel = 0; updateGoSel();
}

// ── Game over menu ───────────────────────────────────────────────────────────
let goSel = 0; // 0=RETRY, 1=EXIT TO MENU
function updateGoSel() {
  document.getElementById('goRetryBtn').classList.toggle('sel', goSel === 0);
  document.getElementById('goMenuBtn').classList.toggle('sel', goSel === 1);
}
function goRetry() { document.getElementById('gameOver').classList.add('hidden'); startGame(); }
function goMenu() { window.location.href = 'index.html'; }

// ── Input ────────────────────────────────────────────────────────────────────
// TODO: lisää pelikohtaiset toiminnot
function moveLeft()  { /* TODO */ }
function moveRight() { /* TODO */ }
function tapAction() { /* TODO */ }

document.addEventListener('keydown', e => {
  // Confirm dialog open
  if (!document.getElementById('confirmBox').classList.contains('hidden')) {
    if (e.key === 'ArrowLeft' || e.key === 'y' || e.key === 'Y') { e.preventDefault(); confirmSel=0; updateConfirmSel(); }
    else if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') { e.preventDefault(); confirmSel=1; updateConfirmSel(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (confirmSel===0) window.location.href='index.html'; else hideConfirm(); }
    else if (e.key === 'Escape') { e.preventDefault(); hideConfirm(); }
    return;
  }
  // Pause menu navigation
  if (paused) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); pauseSel = pauseSel===0 ? 1 : 0; updatePauseSel(); return; }
    if (e.key === 'Enter') { e.preventDefault(); if (pauseSel===1) showConfirm(); else togglePause(); return; }
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); return; }
    return;
  }
  if (e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleMusic(); return; }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { e.preventDefault(); togglePause(); return; }
  // Game over menu navigation
  if (!document.getElementById('gameOver').classList.contains('hidden')) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); goSel = goSel === 0 ? 1 : 0; updateGoSel(); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (goSel === 1) goMenu(); else goRetry(); }
    return;
  }
  if (!gameRunning || paused) return;
  switch(e.key) {
    case 'ArrowLeft':  e.preventDefault(); moveLeft();  break;
    case 'ArrowRight': e.preventDefault(); moveRight(); break;
    case 'ArrowUp':
    case ' ':          e.preventDefault(); tapAction(); break;
  }
});

// ── Touch ────────────────────────────────────────────────────────────────────
const bw = document.getElementById('boardWrap');
let tx, ty, tt, moved, lastMX, totalDY, startY;
const SH = 24, SV = 30;

document.addEventListener('touchstart', e => {
  if (!gameRunning || paused || e.target.closest('.topbar')) return;
  e.preventDefault();
  const t = e.touches[0];
  tx = t.clientX; ty = t.clientY; startY = t.clientY; tt = Date.now();
  moved = false; lastMX = tx; totalDY = 0;
}, { passive: false });

document.addEventListener('touchmove', e => {
  if (!gameRunning || paused) return;
  e.preventDefault();
  const t = e.touches[0];
  const dx = t.clientX - lastMX, dy = t.clientY - ty;
  if (Math.abs(dx) > SH) {
    const s = Math.floor(Math.abs(dx) / SH);
    for (let i = 0; i < s; i++) dx > 0 ? moveRight() : moveLeft();
    lastMX += Math.sign(dx) * s * SH; moved = true;
  }
  if (dy > SV) {
    const s = Math.floor(dy / SV);
    // TODO: soft drop tai muu alas-toiminto
    ty += s * SV; totalDY += s * SV; moved = true;
  }
}, { passive: false });

document.addEventListener('touchend', e => {
  if (!gameRunning || paused) return;
  e.preventDefault();
  const el = Date.now() - tt, ct = e.changedTouches[0];
  const fdx = ct.clientX - tx, totalDown = ct.clientY - startY;
  // Nopea swipe alas = vahva toiminto (hard drop tms.)
  if (moved && totalDown > 40 && el > 0 && (totalDown / el) > 0.8) { /* TODO: hardDrop */ return; }
  // Tap = ensisijainen toiminto
  if (!moved && el < 250 && Math.abs(fdx) < 12 && Math.abs(ct.clientY - startY) < 12) tapAction();
}, { passive: false });

// ── Pause ────────────────────────────────────────────────────────────────────
const pauseOv = document.getElementById('pauseOverlay');
let pauseSel = 0;
function updatePauseSel() { document.getElementById('resumeBtn').classList.toggle('sel', pauseSel === 0); document.getElementById('menuBtn').classList.toggle('sel', pauseSel === 1); }
function togglePause() {
  if (!gameRunning) return;
  paused = !paused;
  pauseOv.classList.toggle('hidden', !paused);
  if (!paused) { lastTime = 0; music.resume(); requestAnimationFrame(gameLoop); }
  else { music.pause(); pauseSel = 0; updatePauseSel(); }
}
document.getElementById('pauseBtn').addEventListener('click', e => { e.stopPropagation(); togglePause(); });
document.getElementById('pauseBtn').addEventListener('touchend', e => { e.stopPropagation(); e.preventDefault(); togglePause(); });
pauseOv.addEventListener('click', e => { if (!['resumeBtn','menuBtn','confirmYes','confirmNo'].includes(e.target.id) && !e.target.closest('#confirmBox')) togglePause(); });
pauseOv.addEventListener('touchend', e => { if (!['resumeBtn','menuBtn','confirmYes','confirmNo'].includes(e.target.id) && !e.target.closest('#confirmBox')) { e.preventDefault(); togglePause(); } });
['click', 'touchend'].forEach(ev => document.getElementById('resumeBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); togglePause(); }));
// Confirm exit
let confirmSel=0; // 0=YES 1=NO
function showConfirm(){
  document.getElementById('confirmBox').classList.remove('hidden');
  confirmSel=0;updateConfirmSel();
}
function hideConfirm(){document.getElementById('confirmBox').classList.add('hidden');}
function updateConfirmSel(){
  document.getElementById('confirmYes').classList.toggle('sel',confirmSel===0);
  document.getElementById('confirmNo').classList.toggle('sel',confirmSel===1);
}
['click', 'touchend'].forEach(ev => document.getElementById('menuBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); showConfirm(); }));
['click', 'touchend'].forEach(ev => document.getElementById('confirmYes').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); window.location.href = 'index.html'; }));
['click', 'touchend'].forEach(ev => document.getElementById('confirmNo').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); hideConfirm(); }));

// ── Game loop ─────────────────────────────────────────────────────────────────
function gameLoop(time) {
  if (!gameRunning) { draw(); return; }
  if (paused) return;
  const dt = time - (lastTime || time);
  lastTime = time;
  checkPerf();
  // TODO: päivitä pelin tila dt:n perusteella
  draw();
  requestAnimationFrame(gameLoop);
}

// ── Aloitus ───────────────────────────────────────────────────────────────────
function startGame() {
  scoreVal = 0; gameRunning = true; paused = false; lastTime = 0;
  try { hiScore = parseInt(localStorage.getItem('gamename_hi')) || 0; } catch(e) { hiScore = 0; }
  // TODO: alusta pelikohtainen tila
  updateUI(); draw();
  music.play();
  requestAnimationFrame(gameLoop);
}

['click', 'touchend'].forEach(ev => {
  document.getElementById('startScreen').addEventListener(ev, e => {
    e.preventDefault(); document.getElementById('startScreen').classList.add('hidden'); startGame();
  });
  document.getElementById('goRetryBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); goRetry(); });
  document.getElementById('goMenuBtn').addEventListener(ev, e => { e.stopPropagation(); e.preventDefault(); goMenu(); });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const s = document.getElementById('startScreen');
    if (!s.classList.contains('hidden')) { e.preventDefault(); s.classList.add('hidden'); startGame(); }
  }
});

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
  const wrap = document.getElementById('boardWrap');
  const tb = document.querySelector('.topbar'), th = document.querySelector('.touch-hint');
  const aH = window.innerHeight - (tb ? tb.offsetHeight : 0) - (th ? th.offsetHeight : 0), aW = window.innerWidth;
  const aspect = CANVAS_H / CANVAS_W;
  let h = aH, w = h / aspect;
  if (w > aW) { w = aW; h = w * aspect; }
  canvas.style.width = Math.floor(w) + 'px';
  canvas.style.height = Math.floor(h) + 'px';
  document.getElementById('gameUI').style.width = Math.floor(w) + 'px';
}
window.addEventListener('resize', resize);
setTimeout(resize, 50); setTimeout(resize, 200); resize();

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
drawBackground();
</script>
